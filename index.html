<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팬더TV 기념일 룰렛 시스템</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
    body { background-color: #1a1a24; color: #fff; padding: 20px; }
    
    .container { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; flex-wrap: wrap; }
    .panel { background: #252636; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .left-panel { flex: 1.2; min-width: 550px; }
    .right-panel { flex: 0.8; min-width: 400px; display: flex; flex-direction: column; align-items: center; }

    h2 { font-size: 1.2rem; color: #ff3366; margin-bottom: 15px; border-bottom: 2px solid #33354a; padding-bottom: 8px; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; margin-bottom: 15px; text-align: center; font-size: 0.9rem; }
    th, td { border: 1px solid #3d3f58; padding: 8px 6px; }
    th { background-color: #2e3047; color: #ffcc00; }
    td input[type="number"], td input[type="text"] {
      width: 90%; background: #1a1a24; border: 1px solid #4a4d6d; color: #fff; text-align: center; border-radius: 4px; padding: 4px;
    }

    /* Controls & Inputs */
    .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
    .input-group input { flex: 1; padding: 10px; background: #1a1a24; border: 1px solid #4a4d6d; color: #fff; border-radius: 6px; }
    
    button { cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; }
    .btn-primary { background: #ff3366; color: #fff; padding: 10px 15px; }
    .btn-primary:hover { background: #e02e5a; }
    .btn-secondary { background: #4a4d6d; color: #fff; padding: 6px 12px; }
    .btn-secondary:hover { background: #5c6087; }
    .btn-danger { background: #e74c3c; color: #fff; padding: 4px 8px; }

    /* +/- Buttons */
    .adj-btn { width: 26px; height: 26px; border-radius: 50%; font-size: 14px; margin: 0 2px; }
    .btn-plus { background: #2ecc71; color: #fff; }
    .btn-minus { background: #e67e22; color: #fff; }

    /* Wheel Area */
    .wheel-container { position: relative; margin: 20px 0; }
    .wheel-pointer {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #ff3366;
      z-index: 10;
    }
    canvas { border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

    .spin-btn { background: #ff3366; color: #fff; font-size: 1.3rem; padding: 15px 40px; border-radius: 30px; margin-top: 10px; width: 100%; max-width: 300px; box-shadow: 0 4px 15px rgba(255,51,102,0.4); }
    .spin-btn:hover { background: #ff4d79; transform: scale(1.03); }
    .spin-btn:disabled { background: #555; cursor: not-allowed; transform: none; }

    .result-box { margin-top: 15px; font-size: 1.4rem; font-weight: bold; color: #ffcc00; text-align: center; height: 35px; }
  </style>
</head>
<body>

<div class="container">
  <!-- 좌측 관리 패널 -->
  <div class="panel left-panel">
    
    <!-- 1. 하트 / 칸수 기준 설정 -->
    <h2>1. 하트/칸수 자동 계산 기준 설정</h2>
    <table id="criteriaTable">
      <thead>
        <tr>
          <th>하트 기준</th>
          <th>부여 칸수</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="criteriaBody">
        <!-- JS 로 동적 생성 -->
      </tbody>
    </table>
    <button class="btn-secondary" onclick="addCriteriaRow()">+ 기준 추가</button>

    <br><br>

    <!-- 2. 참여자 추가 -->
    <h2>2. 참여자 하트 입력</h2>
    <div class="input-group">
      <input type="text" id="userName" placeholder="닉네임">
      <input type="number" id="userHearts" placeholder="하트 수 (예: 55725)">
      <button class="btn-primary" onclick="addParticipant()">참여자 등록</button>
    </div>

    <!-- 3. 참여자 목록 및 조정 -->
    <h2>3. 참여자 명단 및 칸수 조정 (+/-)</h2>
    <table>
      <thead>
        <tr>
          <th>순위</th>
          <th>닉네임</th>
          <th>하트수</th>
          <th>자동계산</th>
          <th>조정</th>
          <th>최종 칸수</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody id="userBody">
        <!-- JS 로 동적 생성 -->
      </tbody>
    </table>
  </div>

  <!-- 우측 룰렛 패널 -->
  <div class="panel right-panel">
    <h2>기념일 룰렛</h2>
    <div class="wheel-container">
      <div class="wheel-pointer"></div>
      <canvas id="wheelCanvas" width="450" height="450"></canvas>
    </div>
    <button class="spin-btn" id="spinBtn" onclick="spinWheel()">SPIN !</button>
    <div class="result-box" id="resultText"></div>
  </div>
</div>

<script>
  // 1. 초기 기준 데이터 (엑셀 이미지 기준)
  let criteriaList = [
    { heart: 12722, slot: 150 },
    { heart: 5252, slot: 75 },
    { heart: 2723, slot: 35 },
    { heart: 1722, slot: 15 },
    { heart: 486, slot: 5 },
    { heart: 282, slot: 3 },
    { heart: 172, slot: 2 },
    { heart: 100, slot: 1 }
  ];

  // 2. 참여자 데이터 구조 [{ id, name, hearts, adjSlots }]
  let participants = [];

  // 색상 팔레트
  const colors = ['#f39c12', '#e74c3c', '#9b59b6', '#3498db', '#1abc9c', '#2ecc71', '#e67e22', '#34495e'];

  // 초기화 함수
  window.onload = function() {
    renderCriteria();
    renderUsers();
    drawWheel();
  };

  // --- [기준 테이블 관련 기능] ---
  function renderCriteria() {
    // 내림차순 정렬 (높은 하트 기준부터 계산하기 위함)
    criteriaList.sort((a, b) => b.heart - a.heart);
    
    const tbody = document.getElementById('criteriaBody');
    tbody.innerHTML = '';
    
    criteriaList.forEach((item, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="number" value="${item.heart}" onchange="updateCriteria(${index}, 'heart', this.value)"></td>
        <td><input type="number" value="${item.slot}" onchange="updateCriteria(${index}, 'slot', this.value)"></td>
        <td><button class="btn-danger" onclick="deleteCriteria(${index})">삭제</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function addCriteriaRow() {
    criteriaList.push({ heart: 1000, slot: 10 });
    renderCriteria();
    recalculateAllUsers();
  }

  function updateCriteria(index, key, value) {
    criteriaList[index][key] = Number(value) || 0;
    renderCriteria();
    recalculateAllUsers();
  }

  function deleteCriteria(index) {
    criteriaList.splice(index, 1);
    renderCriteria();
    recalculateAllUsers();
  }

  // --- [하트 기반 칸수 자동 계산 로직 (Greedy)] ---
  function calculateAutoSlots(hearts) {
    let remaining = hearts;
    let totalSlots = 0;

    for (let c of criteriaList) {
      if (c.heart <= 0) continue;
      const count = Math.floor(remaining / c.heart);
      if (count > 0) {
        totalSlots += count * c.slot;
        remaining %= c.heart;
      }
    }
    return totalSlots;
  }

  function recalculateAllUsers() {
    renderUsers();
    drawWheel();
  }

  // --- [참여자 관리 기능] ---
  function addParticipant() {
    const nameInput = document.getElementById('userName');
    const heartsInput = document.getElementById('userHearts');

    const name = nameInput.value.trim();
    const hearts = Number(heartsInput.value) || 0;

    if (!name) { alert('닉네임을 입력해 주세요.'); return; }

    participants.push({
      id: Date.now(),
      name: name,
      hearts: hearts,
      adjSlots: 0 // 최초 조정값 0
    });

    nameInput.value = '';
    heartsInput.value = '';

    renderUsers();
    drawWheel();
  }

  function adjustSlot(index, delta) {
    participants[index].adjSlots += delta;
    renderUsers();
    drawWheel();
  }

  function deleteParticipant(index) {
    participants.splice(index, 1);
    renderUsers();
    drawWheel();
  }

  function renderUsers() {
    // 하트 높은 순으로 순위 정렬
    participants.sort((a, b) => b.hearts - a.hearts);

    const tbody = document.getElementById('userBody');
    tbody.innerHTML = '';

    participants.forEach((p, index) => {
      const autoSlots = calculateAutoSlots(p.hearts);
      const finalSlots = Math.max(0, autoSlots + p.adjSlots);
      
      // 사용자 객체에 최종 칸수 저장
      p.finalSlots = finalSlots;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${index + 1}</td>
        <td><strong>${p.name}</strong></td>
        <td>${p.hearts.toLocaleString()}</td>
        <td>${autoSlots}칸</td>
        <td>
          <button class="adj-btn btn-minus" onclick="adjustSlot(${index}, -1)">-</button>
          <button class="adj-btn btn-plus" onclick="adjustSlot(${index}, 1)">+</button>
        </td>
        <td style="color:#ffcc00; font-weight:bold;">${finalSlots}칸 (${p.adjSlots >= 0 ? '+' : ''}${p.adjSlots})</td>
        <td><button class="btn-danger" onclick="deleteParticipant(${index})">삭제</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --- [룰렛 그려주기 & 회전 제어 (Canvas)] ---
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  let currentAngle = 0;
  let isSpinning = false;

  function drawWheel() {
    const totalSlotsSum = participants.reduce((sum, p) => sum + (p.finalSlots || 0), 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = centerX - 10;

    if (participants.length === 0 || totalSlotsSum === 0) {
      // 참여자가 없거나 총 칸수가 0일 때
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#33354a';
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('참여자를 추가해주세요', centerX, centerY);
      return;
    }

    let startAngle = currentAngle;

    participants.forEach((p, i) => {
      if (p.finalSlots <= 0) return;

      const sliceAngle = (p.finalSlots / totalSlotsSum) * (Math.PI * 2);
      const endAngle = startAngle + sliceAngle;

      // 부채꼴 그리기
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, radius, startAngle, endAngle);
      ctx.closePath();

      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      ctx.strokeStyle = '#252636';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 텍스트 출력
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(startAngle + sliceAngle / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px sans-serif';
      
      // 부채꼴 크기에 맞게 닉네임 + 칸수 표기
      if (sliceAngle > 0.08) {
        ctx.fillText(`${p.name} (${p.finalSlots}칸)`, radius - 20, 5);
      }
      ctx.restore();

      startAngle = endAngle;
    });
  }

  function spinWheel() {
    const totalSlotsSum = participants.reduce((sum, p) => sum + (p.finalSlots || 0), 0);
    if (isSpinning || totalSlotsSum === 0) return;

    isSpinning = true;
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('resultText').innerText = '추첨 중...';

    // 랜덤 회전 바퀴 수 (5바퀴 ~ 10바퀴 + 알파)
    const rotateAngle = Math.floor(Math.random() * 360) + 1800; 
    const duration = 5000; // 회전 시간 (5초)
    const startTimestamp = performance.now();
    const initialAngle = currentAngle;

    function animate(now) {
      const elapsed = now - startTimestamp;
      const progress = Math.min(elapsed / duration, 1);
      
      // Easing 함수 (감속 효과)
      const easeOut = (t) => 1 - Math.pow(1 - t, 3);
      
      const currentRotate = (rotateAngle * Math.PI / 180) * easeOut(progress);
      currentAngle = initialAngle + currentRotate;

      drawWheel();

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        isSpinning = false;
        document.getElementById('spinBtn').disabled = false;
        calculateWinner();
      }
    }

    requestAnimationFrame(animate);
  }

  function calculateWinner() {
    const totalSlotsSum = participants.reduce((sum, p) => sum + (p.finalSlots || 0), 0);
    
    // 현재 포인터 위치(12시 방향 = -Math.PI / 2)에 해당하는 각도 계산
    let normalizedAngle = (Math.PI * 2 - (currentAngle % (Math.PI * 2)) - Math.PI / 2) % (Math.PI * 2);
    if (normalizedAngle < 0) normalizedAngle += Math.PI * 2;

    let currentSumAngle = 0;
    let winner = null;

    for (let p of participants) {
      if (p.finalSlots <= 0) continue;
      const sliceAngle = (p.finalSlots / totalSlotsSum) * (Math.PI * 2);
      if (normalizedAngle >= currentSumAngle && normalizedAngle < currentSumAngle + sliceAngle) {
        winner = p;
        break;
      }
      currentSumAngle += sliceAngle;
    }

    if (winner) {
      document.getElementById('resultText').innerText = `🎉 당첨자: [ ${winner.name} ] 🎉`;
    }
  }
</script>

</body>
</html>
